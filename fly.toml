# Fly.io: cambia "app" por un nombre único, luego `fly launch --no-deploy --copy-config`,
# `fly volumes create data --size 1` y `fly deploy`.
app = "amigo-invisible-CAMBIAME"
primary_region = "mad"

[build]

[env]
  PORT = "8080"
  DATA_FILE = "/data/data.json"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
